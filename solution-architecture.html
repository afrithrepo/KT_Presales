<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solution architecture</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("solution-architecture");
    (function () {
      const s = window.PROPOSAL_DATA.solutionArchitecture;
      const esc = ProposalApp.escapeHtml;

      const principlesHtml = s.principles
        .map((p) => `<span class="badge badge-red" style="padding:6px 12px;font-size:0.82rem;">${esc(p)}</span>`)
        .join(" ");

      const layersHtml = s.layers
        .map(
          (l) => `
          <div class="arch-layer">
            <div class="arch-layer-header">
              <div class="arch-layer-title">${esc(l.name)}</div>
              <span class="badge badge-orange">${esc(l.tag)}</span>
            </div>
            <p class="card-subtitle">${esc(l.description)}</p>
            <div class="arch-chips">
              ${l.components.map((c) => `<span class="arch-chip">${esc(c)}</span>`).join("")}
            </div>
          </div>
        `
        )
        .join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 03</div>
          <h1 class="section-title">Solution architecture</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="card card-accent-top mb-24">
          <h2 class="card-title">Architectural Overview &amp; Principles</h2>
          <p class="mb-16">${esc(s.overview)}</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">${principlesHtml}</div>
        </div>

        <h2 class="card-title mb-16">Layered Technical Blueprint</h2>
        <div class="arch-stack mb-24">${layersHtml}</div>

        <div class="callout">
          <div class="callout-title">Integration &amp; Reliability Pattern</div>
          <p>${esc(s.integrationNotes)}</p>
        </div>
      `;
    })();
  </script>
</body>
</html>
