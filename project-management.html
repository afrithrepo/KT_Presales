<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Management</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("project-management");
    (function () {
      const s = window.PROPOSAL_DATA.projectManagement;
      const esc = ProposalApp.escapeHtml;

      const govHtml = s.governanceCadence
        .map(
          (g) => `
          <tr>
            <td><strong>${esc(g.forum)}</strong></td>
            <td><span class="badge badge-orange">${esc(g.frequency)}</span></td>
            <td>${esc(g.attendees)}</td>
            <td>${esc(g.purpose)}</td>
          </tr>
        `
        )
        .join("");

      const teamHtml = s.teamStructure
        .map(
          (t) => `
          <div class="card card-accent-top">
            <div class="card-title">${esc(t.role)}</div>
            <p>${esc(t.responsibility)}</p>
          </div>
        `
        )
        .join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 06</div>
          <h1 class="section-title">Project Management</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="card mb-24">
          <p>${esc(s.overview)}</p>
        </div>

        <h2 class="card-title mb-16">Governance &amp; Communication Cadence</h2>
        <div class="table-wrap mb-24">
          <table>
            <thead>
              <tr>
                <th>Forum</th>
                <th>Frequency</th>
                <th>Attendees</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody>${govHtml}</tbody>
          </table>
        </div>

        <h2 class="card-title mt-24 mb-16">Core Delivery Team Structure</h2>
        <div class="grid-2 mb-24">${teamHtml}</div>

        <div class="callout callout-orange">
          <div class="callout-title">RAID &amp; Risk Governance</div>
          <p>${esc(s.riskManagement)}</p>
        </div>
      `;
    })();
  </script>
</body>
</html>
