<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appendix I - Company profile</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("appendix-company-profile");
    (function () {
      const s = window.PROPOSAL_DATA.companyProfile;
      const esc = ProposalApp.escapeHtml;

      const statsHtml = s.stats
        .map(
          (k) => `
          <div class="kpi-card">
            <div class="kpi-value">${esc(k.value)}</div>
            <div class="kpi-label">${esc(k.label)}</div>
            <div class="kpi-note">${esc(k.note)}</div>
          </div>
        `
        )
        .join("");

      const capHtml = s.coreCapabilities.map((c) => `<li>${esc(c)}</li>`).join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 08 • Appendix I</div>
          <h1 class="section-title">Appendix I - Company profile</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="grid-4 mb-24">${statsHtml}</div>

        <div class="card card-accent-top mb-24">
          <h2 class="card-title">About KaarTech</h2>
          <p>${esc(s.overview)}</p>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2 class="card-title">Core Capabilities</h2>
            <ul class="styled-list">${capHtml}</ul>
          </div>
          <div class="card card-orange-top">
            <h2 class="card-title">Global Delivery Model</h2>
            <p>${esc(s.globalPresence)}</p>
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
