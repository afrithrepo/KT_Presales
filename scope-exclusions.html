<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scope considerations and exclusions</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("scope-exclusions");
    (function () {
      const s = window.PROPOSAL_DATA.scopeExclusions;
      const esc = ProposalApp.escapeHtml;

      const assumptionsHtml = s.assumptions.map((a) => `<li>${esc(a)}</li>`).join("");
      const exclusionsHtml = s.exclusions.map((e) => `<li>${esc(e)}</li>`).join("");
      const depsHtml = s.dependencies.map((d) => `<li>${esc(d)}</li>`).join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 07</div>
          <h1 class="section-title">Scope considerations and exclusions</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="grid-2 mb-24">
          <div class="card card-accent-top">
            <h2 class="card-title">Key Project Assumptions</h2>
            <ul class="styled-list">${assumptionsHtml}</ul>
          </div>
          <div class="card card-orange-top">
            <h2 class="card-title">Explicit Exclusions</h2>
            <ul class="styled-list">${exclusionsHtml}</ul>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Client &amp; Third-Party Dependencies</h2>
          <ul class="styled-list">${depsHtml}</ul>
        </div>
      `;
    })();
  </script>
</body>
</html>
