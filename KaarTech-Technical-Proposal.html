<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaarTech — Technical Proposal</title>
  <style>
    /* ==========================================================================
       KaarTech Technical Proposal — Single-File Self-Contained Template
       Brand Palette:
         - Red:       #9D0102
         - Orange:    #FF3F00
         - Grey:      #C0C0C0
         - Dark Grey: #606062
       ========================================================================== */
    :root {
      --kt-red: #9D0102;
      --kt-red-dark: #7A0102;
      --kt-red-soft: rgba(157, 1, 2, 0.08);
      --kt-orange: #FF3F00;
      --kt-orange-soft: rgba(255, 63, 0, 0.10);
      --kt-grey: #C0C0C0;
      --kt-grey-light: #E8E8EA;
      --kt-dark-grey: #606062;

      --bg-page: #F5F5F7;
      --bg-surface: #FFFFFF;
      --bg-sidebar: #1E1E20;
      --text-primary: #1F1F21;
      --text-secondary: #606062;
      --text-on-dark: #F5F5F7;

      --sidebar-width: 290px;
      --topbar-height: 64px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--kt-red); text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--kt-orange); }

    /* Shell */
    .app-shell { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      color: var(--text-on-dark);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      border-right: 1px solid rgba(192, 192, 192, 0.15);
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 22px 24px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.14);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--kt-red) 0%, var(--kt-orange) 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.1rem; color: #FFFFFF;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; min-width: 0; }
    .brand-name { font-size: 1rem; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-tagline { font-size: 0.72rem; color: var(--kt-grey); text-transform: uppercase; letter-spacing: 0.8px; }
    .sidebar-meta {
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(192, 192, 192, 0.1);
      font-size: 0.78rem;
    }
    .sidebar-meta-label { color: var(--kt-grey); text-transform: uppercase; letter-spacing: 0.7px; font-size: 0.68rem; margin-bottom: 2px; }
    .sidebar-meta-client { color: #FFFFFF; font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
    .nav-group-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--kt-grey); padding: 12px 12px 6px; font-weight: 600;
    }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      color: #D4D4D8; font-size: 0.86rem; font-weight: 500;
      margin-bottom: 2px; transition: all 0.18s ease;
      border-left: 3px solid transparent;
      cursor: pointer;
    }
    .nav-link:hover { background: rgba(255, 255, 255, 0.06); color: #FFFFFF; }
    .nav-link.active {
      background: linear-gradient(90deg, rgba(157, 1, 2, 0.28) 0%, rgba(255, 63, 0, 0.10) 100%);
      color: #FFFFFF; font-weight: 600; border-left-color: var(--kt-orange);
    }
    .nav-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.08); color: var(--kt-grey);
      font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
    }
    .nav-link.active .nav-num { background: var(--kt-orange); color: #FFFFFF; }
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(192, 192, 192, 0.14);
      font-size: 0.75rem; color: var(--kt-grey);
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn-print {
      width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid rgba(192, 192, 192, 0.3); background: transparent;
      color: #FFFFFF; font-size: 0.8rem; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-print:hover { border-color: var(--kt-orange); background: rgba(255, 63, 0, 0.15); }

    /* Main */
    .main-wrapper { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: var(--topbar-height); background: var(--bg-surface);
      border-bottom: 1px solid var(--kt-grey-light); padding: 0 36px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mobile-menu-btn {
      display: none; background: none; border: 1px solid var(--kt-grey);
      border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer;
      color: var(--text-primary); font-size: 1.1rem;
    }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); }
    .breadcrumb-sep { color: var(--kt-grey); }
    .breadcrumb-current { color: var(--kt-red); font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .proposal-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px;
      background: var(--kt-red-soft); color: var(--kt-red);
      font-size: 0.76rem; font-weight: 600;
      border: 1px solid rgba(157, 1, 2, 0.18);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--kt-orange); }
    .page-content { flex: 1; padding: 36px 40px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }

    /* Hero */
    .hero-banner {
      background: linear-gradient(135deg, #1E1E20 0%, #2D1213 55%, var(--kt-red) 100%);
      color: #FFFFFF; border-radius: var(--radius-lg); padding: 48px 44px;
      position: relative; overflow: hidden; box-shadow: var(--shadow-lg); margin-bottom: 32px;
    }
    .hero-banner::after {
      content: ''; position: absolute; top: -60px; right: -60px; width: 280px; height: 280px;
      border-radius: 50%; background: radial-gradient(circle, rgba(255, 63, 0, 0.35) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px;
      color: var(--kt-orange); background: rgba(255, 63, 0, 0.14);
      border: 1px solid rgba(255, 63, 0, 0.35); padding: 5px 12px; border-radius: 999px; margin-bottom: 18px;
    }
    .hero-title { font-size: 2.5rem; font-weight: 800; line-height: 1.18; letter-spacing: -0.6px; margin-bottom: 14px; max-width: 780px; }
    .hero-subtitle { font-size: 1.08rem; color: #E4E4E7; max-width: 700px; margin-bottom: 28px; line-height: 1.6; }
    .hero-meta-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px; padding-top: 24px; border-top: 1px solid rgba(192, 192, 192, 0.22);
    }
    .hero-meta-item label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.9px; color: var(--kt-grey); margin-bottom: 3px; }
    .hero-meta-item span { font-size: 0.95rem; font-weight: 600; color: #FFFFFF; }
    .hero-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px; background: var(--kt-orange);
      color: #FFFFFF; font-weight: 600; font-size: 0.92rem; padding: 11px 22px;
      border-radius: var(--radius-sm); border: none; cursor: pointer; transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn-primary:hover { background: #E03700; color: #FFFFFF; transform: translateY(-1px); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF; font-weight: 600; font-size: 0.92rem; padding: 11px 20px;
      border-radius: var(--radius-sm); border: 1px solid rgba(192, 192, 192, 0.35); cursor: pointer;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); color: #FFFFFF; }

    /* Section Header */
    .section-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--kt-grey-light); position: relative; }
    .section-header::after {
      content: ''; position: absolute; left: 0; bottom: -2px; width: 84px; height: 3px;
      background: linear-gradient(90deg, var(--kt-red), var(--kt-orange));
    }
    .section-eyebrow { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--kt-red); margin-bottom: 6px; }
    .section-title { font-size: 2rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.4px; line-height: 1.2; }
    .section-lead { margin-top: 8px; font-size: 1.02rem; color: var(--text-secondary); max-width: 780px; }

    /* Grids & Cards */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .card { background: var(--bg-surface); border: 1px solid var(--kt-grey-light); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
    .card-accent-top { border-top: 3px solid var(--kt-red); }
    .card-orange-top { border-top: 3px solid var(--kt-orange); }
    .card-title { font-size: 1.08rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .card-subtitle { font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 14px; }

    .toc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; margin-top: 16px; }
    .toc-card {
      background: var(--bg-surface); border: 1px solid var(--kt-grey-light); border-radius: var(--radius-md);
      padding: 20px 22px; display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.2s ease; box-shadow: var(--shadow-sm); cursor: pointer;
    }
    .toc-card:hover { border-color: var(--kt-red); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .toc-card-num { font-size: 0.74rem; font-weight: 700; color: var(--kt-orange); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .toc-card-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
    .toc-card-desc { font-size: 0.86rem; color: var(--text-secondary); margin-bottom: 14px; }
    .toc-card-link { font-size: 0.82rem; font-weight: 600; color: var(--kt-red); display: inline-flex; align-items: center; gap: 4px; }

    .kpi-card {
      background: var(--bg-surface); border: 1px solid var(--kt-grey-light);
      border-left: 4px solid var(--kt-red); border-radius: var(--radius-md);
      padding: 18px 20px; box-shadow: var(--shadow-sm);
    }
    .kpi-value { font-size: 1.75rem; font-weight: 800; color: var(--kt-red); line-height: 1.15; }
    .kpi-label { font-size: 0.84rem; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
    .kpi-note { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }

    .callout { background: var(--kt-red-soft); border-left: 4px solid var(--kt-red); border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 18px 22px; margin: 22px 0; }
    .callout-orange { background: var(--kt-orange-soft); border-left-color: var(--kt-orange); }
    .callout-title { font-weight: 700; font-size: 0.94rem; color: var(--kt-red); margin-bottom: 4px; }
    .callout-orange .callout-title { color: #C23000; }

    .styled-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .styled-list li { position: relative; padding-left: 22px; font-size: 0.94rem; color: var(--text-primary); }
    .styled-list li::before { content: ''; position: absolute; left: 0; top: 9px; width: 8px; height: 8px; border-radius: 2px; background: var(--kt-orange); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--kt-grey-light); border-radius: var(--radius-md); background: var(--bg-surface); box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: #2B2B2E; color: #FFFFFF; }
    th { text-align: left; padding: 13px 16px; font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 13px 16px; border-top: 1px solid var(--kt-grey-light); color: var(--text-primary); vertical-align: top; }
    tbody tr:hover { background: #FAFAFB; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; }
    .badge-red { background: var(--kt-red-soft); color: var(--kt-red); }
    .badge-orange { background: var(--kt-orange-soft); color: #C23000; }
    .badge-grey { background: #EFEFF1; color: var(--kt-dark-grey); }

    .arch-stack { display: flex; flex-direction: column; gap: 14px; }
    .arch-layer { background: var(--bg-surface); border: 1px solid var(--kt-grey-light); border-left: 5px solid var(--kt-red); border-radius: var(--radius-md); padding: 18px 22px; box-shadow: var(--shadow-sm); }
    .arch-layer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .arch-layer-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
    .arch-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .arch-chip { background: #F4F4F6; border: 1px solid var(--kt-grey); color: var(--text-primary); padding: 5px 12px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 500; }

    .phase-timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .phase-card { background: var(--bg-surface); border: 1px solid var(--kt-grey-light); border-top: 4px solid var(--kt-red); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); }
    .phase-step { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; color: var(--kt-orange); margin-bottom: 4px; }
    .phase-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .phase-duration { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--kt-grey-light); }

    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-24 { margin-bottom: 24px; }

    /* Pagination */
    .page-pagination {
      margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--kt-grey-light);
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .page-nav-btn {
      flex: 1; min-width: 220px; max-width: 340px;
      background: var(--bg-surface); border: 1px solid var(--kt-grey-light);
      border-radius: var(--radius-md); padding: 14px 18px;
      display: flex; flex-direction: column; transition: all 0.2s ease; cursor: pointer;
    }
    .page-nav-btn:hover { border-color: var(--kt-red); box-shadow: var(--shadow-sm); }
    .page-nav-btn.next { text-align: right; margin-left: auto; }
    .page-nav-dir { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); font-weight: 600; }
    .page-nav-title { font-size: 0.96rem; font-weight: 700; color: var(--kt-red); margin-top: 2px; }

    @media (max-width: 960px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
      .main-wrapper { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .page-content { padding: 24px 20px 48px; }
      .topbar { padding: 0 20px; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .hero-banner { padding: 32px 24px; }
      .hero-title { font-size: 1.85rem; }
    }

    /* Print-only Full Document Container (hidden on screen) */
    #print-document { display: none; }

    @media print {
      @page {
        size: A4;
        margin: 16mm 15mm;
      }

      body {
        background: #FFFFFF !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .app-shell { display: none !important; }
      #print-document { display: block !important; }

      .print-page-break {
        break-before: page;
        page-break-before: always;
      }

      /* Cover Page */
      .print-cover {
        height: 262mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        padding: 8mm 4mm;
      }

      .print-cover-image-wrap {
        width: 100%;
        height: 145mm;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--kt-grey-light);
        background: #F4F4F6;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .print-cover-image-wrap img,
      .print-cover-image-wrap svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .print-cover-title-wrap {
        margin-top: 18mm;
        border-left: 6px solid var(--kt-red);
        padding-left: 18px;
      }

      .print-cover-title {
        font-size: 2.35rem;
        font-weight: 800;
        color: var(--text-primary);
        line-height: 1.2;
        letter-spacing: -0.5px;
      }

      .print-cover-date-row {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        padding-top: 12mm;
      }

      .print-cover-date {
        font-size: 1rem;
        font-weight: 600;
        color: var(--kt-dark-grey);
        border-top: 2px solid var(--kt-orange);
        padding-top: 6px;
        min-width: 160px;
        text-align: right;
      }

      /* Version Control & Confidentiality */
      .print-doc-meta-page {
        padding-top: 6mm;
      }

      .print-toc-list {
        list-style: none;
        margin-top: 16px;
        border: 1px solid var(--kt-grey-light);
        border-radius: 8px;
        overflow: hidden;
      }

      .print-toc-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--kt-grey-light);
        font-size: 0.96rem;
      }

      .print-toc-item:last-child { border-bottom: none; }
      .print-toc-num { font-weight: 700; color: var(--kt-red); width: 42px; display: inline-block; }
      .print-toc-title { font-weight: 600; color: var(--text-primary); flex: 1; }
      .print-toc-group { font-size: 0.78rem; color: var(--kt-dark-grey); text-transform: uppercase; letter-spacing: 0.6px; }

      .card, .arch-layer, .phase-card, .kpi-card, .table-wrap, .callout {
        box-shadow: none !important;
        break-inside: avoid;
      }

      .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
      .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
    }
  </style>
</head>
<body>

    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="page-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>
  <div id="print-document" aria-hidden="true"></div>

              <p class="section-lead">${esc(s.lead)}</p>

            <div class="grid-2 mb-24">
              <div class="card card-accent-top"><h2 class="card-title">Key Project Assumptions</h2><ul class="styled-list">${s.assumptions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>
              <div class="card card-orange-top"><h2 class="card-title">Explicit Exclusions</h2><ul class="styled-list">${s.exclusions.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>
            </div>
            <div class="card"><h2 class="card-title">Client &amp; Third-Party Dependencies</h2><ul class="styled-list">${s.dependencies.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
          `;
        }
        case "appendix-company-profile": {
          const s = d.companyProfile;
          return `
            <div class="section-header">
              <div class="section-eyebrow">Section 08 • Appendix I</div>
              <h1 class="section-title">Appendix I - Company profile</h1>
              <p class="section-lead">${esc(s.lead)}</p>
            </div>
            <div class="grid-4 mb-24">${s.stats.map((k) => `<div class="kpi-card"><div class="kpi-value">${esc(k.value)}</div><div class="kpi-label">${esc(k.label)}</div><div class="kpi-note">${esc(k.note)}</div></div>`).join("")}</div>
            <div class="card card-accent-top mb-24"><h2 class="card-title">About KaarTech</h2><p>${esc(s.overview)}</p></div>
            <div class="grid-2">
              <div class="card"><h2 class="card-title">Core Capabilities</h2><ul class="styled-list">${s.coreCapabilities.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
              <div class="card card-orange-top"><h2 class="card-title">Global Delivery Model</h2><p>${esc(s.globalPresence)}</p></div>
            </div>
          `;
        }
        case "appendix-certifications": {
          const s = d.certifications;
          return `
            <div class="section-header">
              <div class="section-eyebrow">Section 09 • Appendix II</div>
              <h1 class="section-title">Appendix II - Certifications</h1>
              <p class="section-lead">${esc(s.lead)}</p>
            </div>
            <div class="card mb-24"><p>${esc(s.overview)}</p></div>
            <div class="grid-3">${s.items.map((c) => `<div class="card card-accent-top"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;"><h2 class="card-title" style="margin:0;">${esc(c.title)}</h2><span class="badge badge-red">${esc(c.category)}</span></div><p>${esc(c.description)}</p></div>`).join("")}</div>
          `;
        }
        case "appendix-case-studies": {
          const s = d.caseStudies;
          return `
            <div class="section-header">
              <div class="section-eyebrow">Section 10 • Appendix III</div>
              <h1 class="section-title">Appendix III - Case studies</h1>
              <p class="section-lead">${esc(s.lead)}</p>
            </div>
            <div class="card mb-24"><p>${esc(s.overview)}</p></div>
            ${s.studies.map((st) => `
              <div class="card card-accent-top mb-24">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
                  <h2 class="card-title" style="margin:0;">${esc(st.client)}</h2>
                  <span class="badge badge-orange">${esc(st.industry)}</span>
                </div>
                <div class="grid-3">
                  <div><div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-dark-grey);">Challenge</div><p>${esc(st.challenge)}</p></div>
                  <div><div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-dark-grey);">Solution</div><p>${esc(st.solution)}</p></div>
                  <div><div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-red);">Business Outcomes</div><ul class="styled-list">${st.outcomes.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>
                </div>
              </div>
            `).join("")}
          `;
        }
        default:
          return "";
      }
    }

    function renderApp() {
      const hash = (window.location.hash || "#home").replace("#", "");
      const currentIndex = Math.max(0, PAGES.findIndex((p) => p.id === hash));
      const currentPage = PAGES[currentIndex];
      const data = window.PROPOSAL_DATA;

      document.title = `${currentPage.title} | ${data.meta.brandName} — ${data.meta.proposalTitle}`;

      // Sidebar
      const groups = ["Overview", "Proposal Sections", "Appendices"];
      const navHtml = groups.map((group) => {
        const links = PAGES.filter((p) => p.group === group).map((p) => `
          <a class="nav-link ${p.id === currentPage.id ? "active" : ""}" href="#${p.id}">
            <span class="nav-num">${p.num}</span>
            <span>${esc(p.title)}</span>
          </a>
        `).join("");
        return `<div class="nav-group-label">${group}</div>${links}`;
      }).join("");

      const sidebarEl = document.getElementById("app-sidebar");
      sidebarEl.innerHTML = `
        <div class="sidebar-brand">
          <div class="brand-mark">${esc(data.meta.brandInitials)}</div>
          <div class="brand-text">
            <span class="brand-name">${esc(data.meta.brandName)}</span>
            <span class="brand-tagline">${esc(data.meta.brandTagline)}</span>
          </div>
        </div>
        <div class="sidebar-meta">
          <div class="sidebar-meta-label">Prepared For</div>
          <div class="sidebar-meta-client" title="${esc(data.meta.clientName)}">${esc(data.meta.clientName)}</div>
        </div>
        <nav class="sidebar-nav" aria-label="Proposal Sections">${navHtml}</nav>
        <div class="sidebar-footer">
          <button class="btn-print" onclick="window.print()" type="button">⎙ Print / Save as PDF</button>
          <div>ID: ${esc(data.meta.proposalId)} • ${esc(data.meta.date)}</div>
        </div>
      `;

      // Topbar
      document.getElementById("app-topbar").innerHTML = `
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
          <div class="breadcrumb">
            <a href="#home">${esc(data.meta.proposalTitle)}</a>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current">${esc(currentPage.title)}</span>
          </div>
        </div>
        <div class="topbar-right">
          <span class="proposal-badge"><span class="status-dot"></span>${esc(data.meta.statusBadge)}</span>
        </div>
      `;

      document.getElementById("mobile-menu-toggle").addEventListener("click", () => {
        sidebarEl.classList.toggle("open");
      });

      // Close mobile sidebar after clicking a link
      sidebarEl.classList.remove("open");

      // Main content
      document.getElementById("page-root").innerHTML = renderPageContent(currentPage.id);

      // Pagination
      const prev = currentIndex > 0 ? PAGES[currentIndex - 1] : null;
      const next = currentIndex < PAGES.length - 1 ? PAGES[currentIndex + 1] : null;
      document.getElementById("page-pagination").innerHTML = `
        ${prev ? `<a class="page-nav-btn prev" href="#${prev.id}"><span class="page-nav-dir">← Previous</span><span class="page-nav-title">${esc(prev.num + ". " + prev.title)}</span></a>` : `<div></div>`}
        ${next ? `<a class="page-nav-btn next" href="#${next.id}"><span class="page-nav-dir">Next →</span><span class="page-nav-title">${esc(next.num + ". " + next.title)}</span></a>` : `<div></div>`}
      `;

      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function getDefaultCoverSvg(clientName) {
      return `
        <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Customer Office Illustration">
          <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E1E20" />
              <stop offset="60%" stop-color="#3A1516" />
              <stop offset="100%" stop-color="#9D0102" />
            </linearGradient>
            <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#C0C0C0" stop-opacity="0.06" />
            </linearGradient>
          </defs>
          <rect width="800" height="450" fill="url(#skyGrad)" />
          <circle cx="670" cy="95" r="56" fill="#FF3F00" fill-opacity="0.24" />
          <circle cx="670" cy="95" r="34" fill="#FF3F00" fill-opacity="0.35" />
          <!-- Left Tower -->
          <rect x="110" y="150" width="150" height="250" rx="4" fill="#2A2A2D" stroke="#606062" stroke-width="2" />
          <rect x="128" y="172" width="114" height="210" fill="url(#glassGrad)" />
          <!-- Center Main Customer Tower -->
          <rect x="285" y="90" width="230" height="310" rx="4" fill="#1F1F22" stroke="#C0C0C0" stroke-width="2" />
          <rect x="305" y="115" width="190" height="265" fill="url(#glassGrad)" />
          <line x1="305" y1="165" x2="495" y2="165" stroke="#C0C0C0" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="305" y1="215" x2="495" y2="215" stroke="#C0C0C0" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="305" y1="265" x2="495" y2="265" stroke="#C0C0C0" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="305" y1="315" x2="495" y2="315" stroke="#C0C0C0" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="368" y1="115" x2="368" y2="380" stroke="#C0C0C0" stroke-opacity="0.25" stroke-width="1.5" />
          <line x1="432" y1="115" x2="432" y2="380" stroke="#C0C0C0" stroke-opacity="0.25" stroke-width="1.5" />
          <!-- Right Wing -->
          <rect x="540" y="190" width="150" height="210" rx="4" fill="#2A2A2D" stroke="#606062" stroke-width="2" />
          <rect x="558" y="212" width="114" height="170" fill="url(#glassGrad)" />
          <!-- Ground Accent -->
          <rect x="0" y="400" width="800" height="50" fill="#141416" />
          <rect x="0" y="398" width="800" height="4" fill="#FF3F00" />
          <text x="400" y="430" text-anchor="middle" fill="#C0C0C0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">${esc(clientName.toUpperCase())}</text>
        </svg>
      `;
    }

    function renderPrintDocument() {
      const d = window.PROPOSAL_DATA;
      const sections = PAGES.filter((p) => p.id !== "home");

      const coverMedia = d.meta.coverImageUrl
        ? `<img src="${esc(d.meta.coverImageUrl)}" alt="Customer Office" />`
        : getDefaultCoverSvg(d.meta.clientName);

      // 1. Cover Page
      const coverHtml = `
        <section class="print-cover">
          <div class="print-cover-image-wrap">${coverMedia}</div>
          <div class="print-cover-title-wrap">
            <h1 class="print-cover-title">${esc(d.meta.coverTitle || "Technical proposal for mentioned scope")}</h1>
          </div>
          <div class="print-cover-date-row">
            <div class="print-cover-date">${esc(d.meta.date)}</div>
          </div>
        </section>
      `;

      // 2. Version Control & Document Confidentiality Page
      const vcRows = (d.versionControl || []).map((v) => `
        <tr>
          <td><strong>${esc(v.version)}</strong></td>
          <td>${esc(v.date)}</td>
          <td>${esc(v.author)}</td>
          <td>${esc(v.description)}</td>
        </tr>
      `).join("");

      const versionAndConfidentialityHtml = `
        <section class="print-page-break print-doc-meta-page">
          <div class="section-header">
            <div class="section-eyebrow">Document Control</div>
            <h1 class="section-title">Version Control &amp; Confidentiality</h1>
          </div>
          <h2 class="card-title mb-16">Version Control</h2>
          <div class="table-wrap mb-24">
            <table>
              <thead>
                <tr>
                  <th>Version</th>
                  <th>Date</th>
                  <th>Author</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>${vcRows}</tbody>
            </table>
          </div>
          <div class="callout" style="margin-top:28px;">
            <div class="callout-title">Document Confidentiality</div>
            <p>${esc(d.confidentialityNotice)}</p>
          </div>
        </section>
      `;

      // 3. Table of Contents Page
      const tocItems = sections.map((s) => `
        <li class="print-toc-item">
          <span class="print-toc-num">${esc(s.num)}</span>
          <span class="print-toc-title">${esc(s.title)}</span>
          <span class="print-toc-group">${esc(s.group)}</span>
        </li>
      `).join("");

      const tocHtml = `
        <section class="print-page-break print-doc-meta-page">
          <div class="section-header">
            <div class="section-eyebrow">Navigation</div>
            <h1 class="section-title">Table of Contents</h1>
          </div>
          <ul class="print-toc-list">${tocItems}</ul>
        </section>
      `;

      // 4. All 10 Technical Sections (each starting on a new page)
      const sectionsHtml = sections.map((s) => `
        <section class="print-page-break">
          ${renderPageContent(s.id)}
        </section>
      `).join("");

      document.getElementById("print-document").innerHTML =
        coverHtml + versionAndConfidentialityHtml + tocHtml + sectionsHtml;
    }

    window.addEventListener("hashchange", renderApp);
    window.addEventListener("beforeprint", renderPrintDocument);
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
      renderPrintDocument();
    });
  </script>
</body>
</html>
