<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appendix III - Case studies</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("appendix-case-studies");
    (function () {
      const s = window.PROPOSAL_DATA.caseStudies;
      const esc = ProposalApp.escapeHtml;

      const studiesHtml = s.studies
        .map(
          (st) => `
          <div class="card card-accent-top mb-24">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
              <h2 class="card-title" style="margin:0;">${esc(st.client)}</h2>
              <span class="badge badge-orange">${esc(st.industry)}</span>
            </div>
            <div class="grid-3">
              <div>
                <div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-dark-grey);">Challenge</div>
                <p>${esc(st.challenge)}</p>
              </div>
              <div>
                <div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-dark-grey);">Solution</div>
                <p>${esc(st.solution)}</p>
              </div>
              <div>
                <div class="nav-group-label" style="padding:0 0 6px;color:var(--kt-red);">Business Outcomes</div>
                <ul class="styled-list">
                  ${st.outcomes.map((o) => `<li>${esc(o)}</li>`).join("")}
                </ul>
              </div>
            </div>
          </div>
        `
        )
        .join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 10 • Appendix III</div>
          <h1 class="section-title">Appendix III - Case studies</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="card mb-24">
          <p>${esc(s.overview)}</p>
        </div>

        ${studiesHtml}
      `;
    })();
  </script>
</body>
</html>
