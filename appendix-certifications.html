<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appendix II - Certifications</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="page-content">
        <div id="section-root"></div>
        <div class="page-pagination" id="page-pagination"></div>
      </main>
    </div>
  </div>

  <script src="data/proposal-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    ProposalApp.initShell("appendix-certifications");
    (function () {
      const s = window.PROPOSAL_DATA.certifications;
      const esc = ProposalApp.escapeHtml;

      const itemsHtml = s.items
        .map(
          (c) => `
          <div class="card card-accent-top">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
              <h2 class="card-title" style="margin:0;">${esc(c.title)}</h2>
              <span class="badge badge-red">${esc(c.category)}</span>
            </div>
            <p>${esc(c.description)}</p>
          </div>
        `
        )
        .join("");

      document.getElementById("section-root").innerHTML = `
        <div class="section-header">
          <div class="section-eyebrow">Section 09 • Appendix II</div>
          <h1 class="section-title">Appendix II - Certifications</h1>
          <p class="section-lead">${esc(s.lead)}</p>
        </div>

        <div class="card mb-24">
          <p>${esc(s.overview)}</p>
        </div>

        <div class="grid-3">${itemsHtml}</div>
      `;
    })();
  </script>
</body>
</html>
